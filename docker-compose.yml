version: '3.4'

services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - "sqlserver"
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - eshop_shared

  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - eshop_shared

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=@someThingComplicated1234
      - ACCEPT_EULA=Y
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - eshop_shared

networks:
  eshop_shared:
    external: true

volumes:
  sql_data:
  dataprotection_keys:
    external: true
